# PostgreSQL para rodar a aplicação localmente.
# O Spring Boot sobe este container sozinho no ./mvnw spring-boot:run (spring-boot-docker-compose).
# Credenciais apenas de desenvolvimento local; nunca usar em outro ambiente.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: organizacao_recursos
      POSTGRES_USER: organizacao
      POSTGRES_PASSWORD: organizacao_dev
    ports:
      - "5432"
