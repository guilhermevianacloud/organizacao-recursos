spring.application.name=organizacao-recursos

# O esquema do banco é criado só pelas migrações do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (ADR-003). A chave vem da variável de ambiente JWT_SEGREDO (mínimo 32 caracteres).
# Sem ela, a aplicação gera uma chave aleatória a cada início: os tokens deixam de valer ao reiniciar.
app.jwt.segredo=${JWT_SEGREDO:}
app.jwt.validade=PT60M

# Usuários e recursos de demonstração, criados só quando o banco está vazio.
# Senha apenas para demonstração local; troque por DEMO_SENHA ou desligue com app.demo.habilitado=false.
app.demo.habilitado=true
app.demo.senha=${DEMO_SENHA:demo123}

springdoc.swagger-ui.path=/swagger-ui.html

# Notificação (RF-11, ADR-005). Sem URL, a notificação é simulada (só registra no log).
app.notificacao.url=${NOTIFICACAO_URL:}
app.notificacao.chave=${NOTIFICACAO_CHAVE:}
app.notificacao.timeout=PT2S
